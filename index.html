<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Year End Well Being Survey — Trust Health Asia</title>
<style>
  :root {
    --blue: #0071e3;
    --blue-dark: #0058b0;
    --ink: #1d1d1f;
    --gray: #6e6e73;
    --gray-light: #86868b;
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #d2d2d7;
    --red: #ff3b30;
    --red-bg: #fff1f0;
    --amber: #c9862c;
    --amber-bg: #fff8e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--ink);
    line-height: 1.47;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 90px; }
  header {
    background: linear-gradient(180deg, #000000 0%, #1d1d1f 100%);
    color: white;
    padding: 56px 24px 44px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 0; font-size: 15px; color: #a1a1a6; font-weight: 400; }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 26px 24px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  }
  .notice { background: #eef6ff; border-radius: 14px; padding: 16px 18px; font-size: 13.5px; color: #1d1d1f; margin-bottom: 20px; line-height: 1.5; }
  .notice strong { color: var(--blue-dark); }
  .notice-soft { background: #f5f5f7; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 13px; color: var(--gray); margin-bottom: 18px; }
  .warn-box { background: var(--amber-bg); border-radius: 14px; padding: 16px 18px; font-size: 13.5px; margin-bottom: 16px; }

  .section-title { font-size: 22px; font-weight: 700; color: var(--ink); margin: 0 0 4px; letter-spacing: -0.015em; }
  .section-sub { font-size: 13.5px; color: var(--gray-light); margin: 0 0 22px; }

  .q { margin-bottom: 38px; }
  .q:last-child { margin-bottom: 0; }
  .q-text { font-size: 15.5px; font-weight: 500; margin-bottom: 14px; color: var(--ink); }
  .q-text .req-star { color: var(--red); margin-left: 3px; }
  .q-error-msg { color: var(--red); font-size: 12.5px; font-weight: 600; margin-top: 10px; display: flex; align-items: center; gap: 5px; }
  .q.has-error .q-text { color: var(--red); }

  input[type=text] {
    width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; font-family: inherit; background: #fbfbfd; transition: border-color 0.15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--blue); background: white; }
  textarea {
    width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; font-family: inherit; min-height: 76px; resize: vertical; background: #fbfbfd;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: white; }
  .q.has-error textarea { border-color: var(--red); background: var(--red-bg); }

  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .pill {
    flex: 0 0 auto; padding: 11px 18px; border: 1px solid var(--border); border-radius: 980px;
    font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.15s;
    background: #fbfbfd; color: var(--ink);
  }
  .pill.selected { background: var(--ink); color: white; border-color: var(--ink); }
  .q.has-error .pill-row { padding: 8px; background: var(--red-bg); border-radius: 16px; }

  /* Custom horizontal slider */
  .hslider-outer { padding: 8px 14px 0; touch-action: none; }
  .hslider-track { position: relative; height: 40px; cursor: pointer; user-select: none; }
  .hslider-bg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 4px; background: var(--border); border-radius: 2px; }
  .hslider-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 4px; background: var(--blue); border-radius: 2px; width: 0%; }
  .hslider-tick { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: var(--border); transform: translate(-50%,-50%); z-index: 2; cursor: pointer; }
  .hslider-tick.active { background: var(--blue); }
  .hslider-thumb {
    position: absolute; top: 50%; width: 28px; height: 28px; border-radius: 50%;
    background: var(--blue); border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.22);
    transform: translate(-50%,-50%); z-index: 3; cursor: grab; left: 0%;
  }
  .hslider-thumb.unanswered { background: #d2d2d7; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .hslider-caption-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray-light); margin-top: 12px; font-weight: 500; }
  .slider-value-badge {
    display: inline-block; background: var(--blue); color: white; font-weight: 600; font-size: 12.5px;
    padding: 5px 13px; border-radius: 980px; margin-top: 10px;
  }
  .slider-value-badge.untouched { background: #e8e8ed; color: var(--gray); }
  .q.has-error .hslider-bg { background: #ffd9d6; }
  .q.has-error .hslider-fill { background: var(--red); }
  .q.has-error .hslider-thumb.unanswered { background: var(--red-bg); border-color: var(--red); }
  .q.has-error .slider-value-badge.untouched { background: var(--red-bg); color: var(--red); }

  .progress-bar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 14px 20px; border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .progress-track { height: 4px; background: #e8e8ed; border-radius: 2px; overflow: hidden; max-width: 640px; margin: 0 auto; }
  .progress-fill { height: 100%; background: var(--blue); transition: width 0.3s; border-radius: 2px; }
  .progress-label { max-width: 640px; margin: 0 auto 8px; font-size: 12px; color: var(--gray-light); font-weight: 500; }

  .btn {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 980px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
    transition: transform 0.1s, opacity 0.15s; font-family: inherit;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:disabled { background: #d2d2d7; cursor: not-allowed; }
  .btn-secondary { background: #e8e8ed; color: var(--ink); }
  .nav-row { display: flex; gap: 10px; margin-top: 18px; }

  .crisis-box { background: #fff1f0; border: 1.5px solid var(--red); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .crisis-box h3 { color: var(--red); margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .crisis-box p { font-size: 14px; margin: 7px 0; }

  .tier-box { border-radius: 16px; padding: 20px; margin-bottom: 18px; }
  .tier-minimal { background: #eafaf3; border: 1.5px solid #30b06e; }
  .tier-mild { background: var(--amber-bg); border: 1.5px solid var(--amber); }
  .tier-moderate { background: #ffe9d9; border: 1.5px solid #c25a1e; }
  .tier-severe { background: #fff1f0; border: 1.5px solid var(--red); }
  .tier-box h3 { margin: 0 0 10px; font-size: 16.5px; font-weight: 700; }
  .tier-minimal h3 { color: #1f8a53; }
  .tier-mild h3 { color: var(--amber); }
  .tier-moderate h3 { color: #c25a1e; }
  .tier-severe h3 { color: var(--red); }
  .tier-box p { font-size: 14px; margin: 8px 0; color: var(--ink); }
  .tier-box .contact-line { font-weight: 600; margin-top: 12px; }

  .hidden { display: none !important; }
  .spinner { border: 3px solid #e8e8ed; border-top: 3px solid var(--blue); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .personal-line { font-size: 14.5px; color: var(--gray); margin-top: 10px; }
  .required-note { font-size: 12.5px; color: var(--gray-light); text-align: center; margin: 14px 0 0; }
  .footer-tag { text-align: center; margin-top: 34px; font-size: 12px; color: var(--gray-light); letter-spacing: 0.02em; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// CONFIG — Apps Script Web App URL (Google Sheet backend)
// ============================================================
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzQ93xINY2MCVJ2UyQU2Mlw3Oq7mGK0wXyV-7egKTZEqkPsccwbOpfEXN-h5qq0zDg/exec";
const DR_LAM_CONTACT = "Dr. Lam (Trust Family Medicine Specialist) — +6017-5762296";

// ---------------- SURVEY DEFINITION ----------------
const FREQ5 = ["Never","Almost Never","Sometimes","Fairly Often","Very Often"];
const CBI_FREQ = ["Never","Seldom","Sometimes","Often","Always"];
const PHQ_FREQ = ["Not at all","Several days","More than half the days","Nearly every day"];

const sections = [
  {
    key: "role",
    title: "About Your Role",
    sub: "Fully anonymous — no name, email, or ID collected.",
    questions: [
      { id: "shift", type: "pills", text: "What is your typical shift pattern?", options: ["Fixed day shift","Rotating shift","Other"] },
      { id: "tenure", type: "pills", text: "How long have you worked at Trust Health Asia?", options: ["Less than 6 months","6 months – 2 years","2–5 years","More than 5 years"] },
      { id: "job_love", type: "hslider", text: "How much do you love your work right now?", steps: 5, min: 1, low: "Not at all", high: "Completely" },
      { id: "job_happy", type: "hslider", text: "How happy are you currently in your post?", steps: 5, min: 1, low: "Very unhappy", high: "Very happy" }
    ]
  },
  {
    key: "sleep",
    title: "Sleep",
    sub: "Over the past 2 weeks.",
    questions: [
      { id: "sleep_hours", type: "pills", text: "On average, how many hours of sleep do you get per night?", options: ["<4 hrs","4–5 hrs","5–6 hrs","6–7 hrs","7–8 hrs",">8 hrs"] },
      { id: "sleep_quality", type: "hslider", text: "How would you rate your overall sleep quality?", steps: 5, min: 1, low: "Very poor", high: "Excellent" },
      { id: "sleep_rested", type: "hslider", text: "Do you feel rested when you wake up?", steps: 5, min: 0, labels: ["Never","Rarely","Sometimes","Often","Always"] },
      { id: "sleep_disrupt", type: "text", text: "What most disrupts your sleep?" }
    ]
  },
  {
    key: "cbi",
    title: "Burnout",
    sub: "Copenhagen Burnout Inventory — drag or tap to show how often each applies to you.",
    questions: [
      { id: "cbi1", type: "hslider", text: "How often are you tired?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi2", type: "hslider", text: "How often are you physically exhausted?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi3", type: "hslider", text: "How often are you emotionally exhausted?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi4", type: "hslider", text: "How often do you think: \"I can't take it anymore\"?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi5", type: "hslider", text: "How often do you feel worn out?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi6", type: "hslider", text: "How often do you feel weak and susceptible to illness?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi7", type: "hslider", text: "Is your work emotionally exhausting?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi8", type: "hslider", text: "Does it frustrate you that you cannot cope well enough at work?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi9", type: "hslider", text: "Do you feel burnt out because of your work?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi10", type: "hslider", text: "Do you find it hard to work with patients/colleagues?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi11", type: "hslider", text: "Are you exhausted in the morning at the thought of another day at work?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi12", type: "hslider", text: "Do you feel that every working hour is tiring for you?", steps: 5, min: 0, labels: CBI_FREQ },
      { id: "cbi13", type: "hslider", text: "Do you feel that you have enough energy for family and friends during leisure time?", steps: 5, min: 0, labels: CBI_FREQ, reverse: true }
    ]
  },
  {
    key: "pss",
    title: "Stress",
    sub: "In the last month, how often have you felt this way? Drag or tap to answer.",
    questions: [
      { id: "pss1", type: "hslider", text: "Felt unable to control the important things in your life", steps: 5, min: 0, labels: FREQ5 },
      { id: "pss2", type: "hslider", text: "Felt confident about your ability to handle personal problems", steps: 5, min: 0, labels: FREQ5, reverse: true },
      { id: "pss3", type: "hslider", text: "Felt that things were going your way", steps: 5, min: 0, labels: FREQ5, reverse: true },
      { id: "pss4", type: "hslider", text: "Felt difficulties were piling up so high you could not overcome them", steps: 5, min: 0, labels: FREQ5 }
    ]
  },
  {
    key: "gad7",
    title: "Anxiety Screening (GAD-7)",
    sub: "Over the last 2 weeks, how often bothered — drag or tap to answer.",
    questions: [
      { id: "gad1", type: "hslider", text: "Feeling nervous, anxious, or on edge", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad2", type: "hslider", text: "Not being able to stop or control worrying", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad3", type: "hslider", text: "Worrying too much about different things", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad4", type: "hslider", text: "Trouble relaxing", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad5", type: "hslider", text: "Being so restless that it is hard to sit still", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad6", type: "hslider", text: "Becoming easily annoyed or irritable", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "gad7q", type: "hslider", text: "Feeling afraid as if something awful might happen", steps: 4, min: 0, labels: PHQ_FREQ }
    ]
  },
  {
    key: "phq9",
    title: "Depression Screening (PHQ-9)",
    sub: "Over the last 2 weeks, how often bothered — drag or tap to answer.",
    questions: [
      { id: "phq1", type: "hslider", text: "Little interest or pleasure in doing things", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq2", type: "hslider", text: "Feeling down, depressed, or hopeless", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq3", type: "hslider", text: "Trouble falling/staying asleep, or sleeping too much", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq4q", type: "hslider", text: "Feeling tired or having little energy", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq5", type: "hslider", text: "Poor appetite or overeating", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq6", type: "hslider", text: "Feeling bad about yourself, or that you've let yourself/family down", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq7", type: "hslider", text: "Trouble concentrating on things", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq8", type: "hslider", text: "Moving/speaking slowly, or being fidgety/restless", steps: 4, min: 0, labels: PHQ_FREQ },
      { id: "phq9_selfharm", type: "hslider", text: "Thoughts that you would be better off dead or of hurting yourself", steps: 4, min: 0, labels: PHQ_FREQ, isSelfHarm: true }
    ]
  },
  {
    key: "feedback",
    title: "Open Feedback",
    sub: "",
    questions: [
      { id: "fb1", type: "text", text: "Anything about your workload, hours, or wellbeing you'd like leadership to know?" },
      { id: "fb2", type: "text", text: "What would help you most right now?" }
    ]
  }
];

// ---------------- STATE ----------------
const STORAGE_KEY = "yewb_survey_progress_v4";
const DEVICE_SUBMIT_KEY = "yewb_device_submitted_v4";

function loadSavedProgress() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveProgress() {
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ step: state.step, answers: state.answers, touched: state.touched })); } catch (e) {}
}
function clearProgress() {
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
function deviceAlreadySubmitted() {
  try { return localStorage.getItem(DEVICE_SUBMIT_KEY) === "yes"; } catch (e) { return false; }
}
function markDeviceSubmitted() {
  try { localStorage.setItem(DEVICE_SUBMIT_KEY, "yes"); } catch (e) {}
}

const saved = loadSavedProgress();
let state = saved
  ? { step: saved.step, answers: saved.answers, touched: saved.touched || {} }
  : { step: 0, answers: {}, touched: {} };
let view = saved ? "survey" : "intro";
let currentErrors = new Set();
window._showResumeBanner = !!saved;

window.addEventListener("beforeunload", function (e) {
  if (view === "survey" || view === "submitting") {
    e.preventDefault();
    e.returnValue = "";
    return "";
  }
});

// ---------------- SCORING ----------------
function scoreSurvey(a) {
  const cbiVal = (id) => {
    let v = a[id];
    if (v === undefined) return null;
    if (id === "cbi13") v = 4 - v;
    return v * 25;
  };
  const personalCbi = ["cbi1","cbi2","cbi3","cbi4","cbi5","cbi6"].map(cbiVal).filter(v=>v!==null);
  const workCbi = ["cbi7","cbi8","cbi9","cbi10","cbi11","cbi12","cbi13"].map(cbiVal).filter(v=>v!==null);
  const avg = arr => arr.length ? Math.round(arr.reduce((s,x)=>s+x,0)/arr.length) : null;

  const pssVal = (id, rev) => {
    let v = a[id];
    if (v === undefined) return 0;
    return rev ? 4 - v : v;
  };
  const pssTotal = ["pss1","pss2","pss3","pss4"].reduce((s,id)=>{
    const rev = id==="pss2"||id==="pss3";
    return s + pssVal(id, rev);
  }, 0);

  const gadItems = ["gad1","gad2","gad3","gad4","gad5","gad6","gad7q"];
  const gadTotal = gadItems.reduce((s,id)=> s + (a[id]||0), 0);

  const phqItems = ["phq1","phq2","phq3","phq4q","phq5","phq6","phq7","phq8","phq9_selfharm"];
  const phqTotal = phqItems.reduce((s,id)=> s + (a[id]||0), 0);

  return {
    cbiPersonal: avg(personalCbi),
    cbiWork: avg(workCbi),
    pssTotal,
    gadTotal,
    phqTotal,
    selfHarmFlag: (a["phq9_selfharm"] || 0) > 0
  };
}

// ---------------- CLINICAL TIERS ----------------
const TIER_ORDER = { minimal: 0, mild: 1, moderate: 2, severe: 3 };
function getTier(score) {
  if (score <= 4) return "minimal";
  if (score <= 9) return "mild";
  if (score <= 14) return "moderate";
  return "severe";
}
function getOverallTier(scores) {
  const gadTier = getTier(scores.gadTotal);
  const phqTier = getTier(scores.phqTotal);
  return TIER_ORDER[gadTier] >= TIER_ORDER[phqTier] ? gadTier : phqTier;
}
function isDualHigh(scores) {
  return scores.gadTotal >= 10 && scores.phqTotal >= 10;
}

function tierContent(tier, dualHigh) {
  const dualNote = dualHigh
    ? `<p><strong>Note:</strong> your responses show elevated stress and mood symptoms together — this combination is linked to a higher risk of burnout, so we'd especially encourage reaching out for support.</p>`
    : "";
  if (tier === "minimal") {
    return {
      cls: "tier-minimal",
      title: "You're in a normal range",
      body: `<p>Your responses fall within a normal range for occupational stress. Keep prioritizing rest, lean on your colleagues when things get busy, and make use of workplace wellness resources whenever helpful.</p>`
    };
  }
  if (tier === "mild") {
    return {
      cls: "tier-mild",
      title: "Some mild stress noted",
      body: `<p>Your responses suggest some mild stress or low mood — common in demanding clinical environments. Consider stress-management techniques, protecting your rest days, and being mindful of workload boundaries.</p>${dualNote}<p class="contact-line">If this continues or worsens, ${DR_LAM_CONTACT} is available for a confidential conversation.</p>`
    };
  }
  if (tier === "moderate") {
    return {
      cls: "tier-moderate",
      title: "Worth a confidential conversation",
      body: `<p>Your responses indicate a level of stress or mood symptoms that would benefit from a confidential evaluation.</p>${dualNote}<p class="contact-line">We'd encourage you to reach out to ${DR_LAM_CONTACT} for a confidential conversation.</p>`
    };
  }
  return {
    cls: "tier-severe",
    title: "Please reach out soon",
    body: `<p>Your responses indicate a significant level of distress. We strongly recommend speaking with a professional as soon as possible.</p>${dualNote}<p class="contact-line">Please reach out to ${DR_LAM_CONTACT}.</p><p>If you are in immediate danger, please call 999 or go to the nearest hospital emergency department.</p>`
  };
}

// ---------------- API CALLS ----------------
async function submitToSheet(row) {
  try {
    await fetch(SHEET_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "submit", row: row })
    });
    return true;
  } catch (e) {
    console.error("Submit failed", e);
    return false;
  }
}

// ---------------- RENDER ----------------
const app = document.getElementById("app");

function render() {
  if (view === "intro") return renderIntro();
  if (view === "survey") return renderSurvey();
  if (view === "submitting") return renderSubmitting();
  if (view === "selfharm") return renderSelfHarm();
  if (view === "done") return renderDone();
  if (view === "error") return renderError();
}

function renderIntro() {
  const deviceNote = deviceAlreadySubmitted()
    ? `<div class="notice-soft">It looks like a response may have already been submitted from this device. If you're a different person sharing this device, please go ahead and continue.</div>`
    : "";
  app.innerHTML = `
    <header>
      <h1>Year End Well Being Survey</h1>
      <p>Trust Health Asia</p>
    </header>
    <div class="wrap">
      ${deviceNote}
      <div class="notice">
        Hi there — this survey is for <strong>you</strong>. It's completely <strong>anonymous</strong> — we do not collect your name, email, or staff ID anywhere. It takes about 6–8 minutes and covers your sleep, stress, and overall wellbeing this year, so we can support the team better.
        <br><br>
        Based on your answers, you'll see some brief, automated feedback at the end. This is generated from your responses only — no one reviews individual answers unless you choose to reach out yourself.
      </div>
      <div class="card">
        <p style="font-size:14.5px; margin: 0 0 4px;">Every question in this survey is required — please answer honestly and completely so we get the full picture.</p>
        <p class="personal-line">Takes about 6–8 minutes. Fully anonymous.</p>
        <button class="btn btn-primary" onclick="startSurvey()">Start Survey</button>
      </div>
      <div class="footer-tag">Trust HR &amp; QA Initiative</div>
    </div>
  `;
}

function startSurvey() {
  clearProgress();
  view = "survey"; state.step = 0; state.answers = {}; state.touched = {};
  currentErrors = new Set();
  render();
}

function renderError() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px;">
      <div class="warn-box">
        We couldn't reach the server to save your response right now. Please check your internet connection and try again in a moment.
      </div>
      <button class="btn btn-primary" onclick="view='survey'; render();">Back to Survey</button>
    </div>
  `;
}

function renderSurvey() {
  const sec = sections[state.step];
  const totalSteps = sections.length;
  const pct = Math.round(((state.step) / totalSteps) * 100);

  let qHtml = "";
  sec.questions.forEach(q => { qHtml += renderQuestion(q); });

  const resumeBanner = window._showResumeBanner
    ? `<div class="notice" style="margin-bottom:14px;">Welcome back — your progress has been saved and picked up right where you left off.</div>`
    : "";

  app.innerHTML = `
    <div class="progress-bar">
      <div class="progress-label">Step ${state.step + 1} of ${totalSteps}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wrap">
      ${resumeBanner}
      <div class="card">
        <div class="section-title">${sec.title}</div>
        ${sec.sub ? `<div class="section-sub">${sec.sub}</div>` : ""}
        ${qHtml}
      </div>
      <div class="nav-row">
        ${state.step > 0 ? `<button class="btn btn-secondary" onclick="prevStep()">Back</button>` : ""}
        <button class="btn btn-primary" onclick="nextStep()">${state.step === totalSteps-1 ? "Submit" : "Next"}</button>
      </div>
      <p class="required-note">All questions are required.</p>
    </div>
  `;
  window._showResumeBanner = false;
  attachSliders();

  if (currentErrors.size > 0) {
    const firstErrorEl = document.querySelector(".q.has-error");
    if (firstErrorEl) firstErrorEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function isAnswered(q) {
  const v = state.answers[q.id];
  if (q.type === "text") return !!(v && v.trim());
  if (q.type === "pills") return v !== undefined && v !== null && v !== "";
  if (q.type === "hslider") return !!state.touched[q.id];
  return true;
}

function renderQuestion(q) {
  const val = state.answers[q.id];
  const hasError = currentErrors.has(q.id);
  const errMsg = hasError ? `<div class="q-error-msg">⚠ Please answer this question to continue</div>` : "";

  if (q.type === "pills") {
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <div class="pill-row">
          ${q.options.map(opt => `
            <div class="pill ${val === opt ? 'selected' : ''}" onclick="setAnswer('${q.id}', '${opt.replace(/'/g,"\\'")}')">${opt}</div>
          `).join("")}
        </div>
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "hslider") {
    const touched = !!state.touched[q.id];
    const idx = touched ? (val - q.min) : 0;
    const steps = q.steps;
    const pct = steps === 1 ? 0 : (idx / (steps - 1)) * 100;
    const labels = q.labels || null;
    const badgeText = touched ? (labels ? labels[idx] : val) : "Tap or drag to answer";
    const lowCaption = labels ? labels[0] : q.low;
    const highCaption = labels ? labels[labels.length - 1] : q.high;

    let ticks = "";
    for (let i = 0; i < steps; i++) {
      const tPct = steps === 1 ? 0 : (i / (steps - 1)) * 100;
      const active = touched && i <= idx;
      ticks += `<div class="hslider-tick ${active ? 'active' : ''}" style="left:${tPct}%" data-index="${i}"></div>`;
    }

    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <div class="hslider-outer" data-id="${q.id}" data-steps="${steps}" data-min="${q.min}" data-labels='${labels ? JSON.stringify(labels) : "null"}'>
          <div class="hslider-track">
            <div class="hslider-bg"></div>
            <div class="hslider-fill" style="width:${touched ? pct : 0}%"></div>
            ${ticks}
            <div class="hslider-thumb ${touched ? '' : 'unanswered'}" style="left:${touched ? pct : 0}%"></div>
          </div>
          <div class="hslider-caption-row"><span>${lowCaption}</span><span>${highCaption}</span></div>
        </div>
        <span class="slider-value-badge ${touched ? '' : 'untouched'}" id="badge-${q.id}">${badgeText}</span>
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "text") {
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <textarea oninput="setAnswer('${q.id}', this.value)">${val || ""}</textarea>
        ${errMsg}
      </div>
    `;
  }
  return "";
}

// ---------------- CUSTOM SLIDER INTERACTION ----------------
function attachSliders() {
  document.querySelectorAll(".hslider-outer").forEach(container => {
    const id = container.dataset.id;
    const steps = parseInt(container.dataset.steps, 10);
    const minVal = parseInt(container.dataset.min, 10);
    const labels = JSON.parse(container.dataset.labels || "null");
    const track = container.querySelector(".hslider-track");
    const thumb = container.querySelector(".hslider-thumb");
    const fill = container.querySelector(".hslider-fill");
    const ticks = container.querySelectorAll(".hslider-tick");
    const badge = document.getElementById("badge-" + id);
    const qEl = container.closest(".q");

    function pctForIndex(i) { return steps === 1 ? 0 : (i / (steps - 1)) * 100; }

    function applyIndex(idx) {
      idx = Math.max(0, Math.min(steps - 1, idx));
      const pct = pctForIndex(idx);
      thumb.style.left = pct + "%";
      fill.style.width = pct + "%";
      thumb.classList.remove("unanswered");
      ticks.forEach((t, i) => t.classList.toggle("active", i <= idx));

      const value = minVal + idx;
      state.answers[id] = value;
      state.touched[id] = true;

      if (badge) {
        badge.textContent = labels ? labels[idx] : value;
        badge.classList.remove("untouched");
      }
      if (qEl && qEl.classList.contains("has-error")) {
        qEl.classList.remove("has-error");
        const msg = qEl.querySelector(".q-error-msg");
        if (msg) msg.remove();
        currentErrors.delete(id);
      }
      saveProgress();
    }

    function idxFromClientX(clientX) {
      const rect = track.getBoundingClientRect();
      let ratio = rect.width === 0 ? 0 : (clientX - rect.left) / rect.width;
      ratio = Math.max(0, Math.min(1, ratio));
      return Math.round(ratio * (steps - 1));
    }

    let dragging = false;
    function onDown(e) {
      dragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      applyIndex(idxFromClientX(clientX));
      if (e.cancelable) e.preventDefault();
    }
    function onMove(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      applyIndex(idxFromClientX(clientX));
      if (e.cancelable) e.preventDefault();
    }
    function onUp() { dragging = false; }

    track.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    track.addEventListener("touchstart", onDown, { passive: false });
    track.addEventListener("touchmove", onMove, { passive: false });
    track.addEventListener("touchend", onUp);
    track.addEventListener("mousedown", onDown);

    ticks.forEach(t => {
      t.addEventListener("click", (e) => {
        e.stopPropagation();
        applyIndex(parseInt(t.dataset.index, 10));
      });
    });
  });
}

function setAnswer(id, value) {
  state.answers[id] = value;
  saveProgress();
  if (currentErrors.has(id) && value && String(value).trim()) {
    currentErrors.delete(id);
  }
  if (event && event.type === "click") {
    render();
  }
}

function prevStep() {
  if (state.step > 0) { state.step--; currentErrors = new Set(); saveProgress(); render(); }
}

function validateStep() {
  const sec = sections[state.step];
  const missing = [];
  sec.questions.forEach(q => {
    if (!isAnswered(q)) missing.push(q.id);
  });
  currentErrors = new Set(missing);
  return missing.length === 0;
}

async function nextStep() {
  if (!validateStep()) {
    render();
    return;
  }

  const isLast = state.step === sections.length - 1;

  if (!isLast) {
    state.step++;
    saveProgress();
    render();
    return;
  }

  // Final submission
  view = "submitting"; render();
  const scores = scoreSurvey(state.answers);
  const a = state.answers;
  const row = [
    new Date().toISOString(),
    a.shift || "",
    a.tenure || "",
    a.job_love ?? "",
    a.job_happy ?? "",
    a.sleep_hours || "",
    a.sleep_quality ?? "",
    scores.gadTotal,
    scores.phqTotal,
    scores.cbiPersonal ?? "",
    scores.cbiWork ?? "",
    scores.pssTotal,
    scores.selfHarmFlag,
    (a.fb1 || "").replace(/\n/g," "),
    (a.fb2 || "").replace(/\n/g," ")
  ];
  const ok = await submitToSheet(row);
  if (!ok) {
    view = "error"; render();
    return;
  }
  clearProgress();
  markDeviceSubmitted();
  window._lastScores = scores;
  view = scores.selfHarmFlag ? "selfharm" : "done";
  render();
}

function renderSubmitting() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:100px; text-align:center;">
      <div class="spinner"></div>
      <p style="color:var(--gray-light); margin-top:18px; font-size:14px;">Submitting your response…</p>
    </div>
  `;
}

function renderSelfHarm() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:50px;">
      <div class="crisis-box">
        <h3>Please reach out for support</h3>
        <p>Thank you for your honesty. One of your answers suggests you may be going through something very difficult right now. You don't have to face this alone.</p>
        <p><strong>${DR_LAM_CONTACT}</strong></p>
        <p>If you are in immediate danger, please go to the nearest hospital emergency department or call 999.</p>
        <p style="margin-top:12px;">Please also consider speaking with a trusted colleague or family member.</p>
      </div>
      <button class="btn btn-primary" onclick="view='done'; render();">Continue</button>
    </div>
  `;
}

function renderDone() {
  const scores = window._lastScores || { gadTotal: 0, phqTotal: 0 };
  const tier = getOverallTier(scores);
  const dualHigh = isDualHigh(scores);
  const content = tierContent(tier, dualHigh);

  app.innerHTML = `
    <div class="wrap" style="padding-top:60px;">
      <div class="card" style="text-align:center;">
        <h2 style="color:var(--blue); font-size:22px; margin:0 0 6px;">Thank you</h2>
        <p style="font-size:14.5px;color:var(--gray);">Your response has been submitted anonymously. We appreciate you taking the time to share this with us.</p>
      </div>
      <div class="tier-box ${content.cls}">
        <h3>${content.title}</h3>
        ${content.body}
      </div>
      <div class="footer-tag">Trust HR &amp; QA Initiative</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
