<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year End Well Being Survey — Trust Health Asia</title>
<style>
  :root {
    --blue: #0071e3;
    --blue-dark: #0058b0;
    --ink: #1d1d1f;
    --gray: #6e6e73;
    --gray-light: #86868b;
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #d2d2d7;
    --red: #ff3b30;
    --red-bg: #fff1f0;
    --green: #30b06e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--ink);
    line-height: 1.47;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 90px; }
  header {
    background: linear-gradient(180deg, #000000 0%, #1d1d1f 100%);
    color: white;
    padding: 56px 24px 44px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p { margin: 0; font-size: 15px; color: #a1a1a6; font-weight: 400; }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 26px 24px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  }
  .notice {
    background: #eef6ff;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 13.5px;
    color: #1d1d1f;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .notice strong { color: var(--blue-dark); }
  .warn-box {
    background: #fff8e5;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 4px;
    letter-spacing: -0.015em;
  }
  .section-sub {
    font-size: 13.5px;
    color: var(--gray-light);
    margin: 0 0 22px;
  }

  .q { margin-bottom: 36px; }
  .q:last-child { margin-bottom: 0; }
  .q-text {
    font-size: 15.5px;
    font-weight: 500;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .q-text .req-star { color: var(--red); margin-left: 3px; }
  .q-error-msg {
    color: var(--red);
    font-size: 12.5px;
    font-weight: 600;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .q.has-error .q-text { color: var(--red); }
  .q.has-error .card-inline-error {
    border: 1.5px solid var(--red);
    background: var(--red-bg);
    border-radius: 12px;
    padding: 10px 4px;
  }

  input[type=text], input[type=email] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfbfd;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=email]:focus {
    outline: none;
    border-color: var(--blue);
    background: white;
  }
  .q.has-error input[type=text], .q.has-error input[type=email] {
    border-color: var(--red);
    background: var(--red-bg);
  }
  textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    min-height: 76px;
    resize: vertical;
    background: #fbfbfd;
  }
  textarea:focus { outline: none; border-color: var(--blue); background: white; }
  .q.has-error textarea { border-color: var(--red); background: var(--red-bg); }

  /* Pill selector (horizontal) */
  .pill-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .pill {
    flex: 0 0 auto;
    padding: 11px 18px;
    border: 1px solid var(--border);
    border-radius: 980px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    background: #fbfbfd;
    color: var(--ink);
  }
  .pill.selected { background: var(--ink); color: white; border-color: var(--ink); }
  .q.has-error .pill-row { padding: 8px; background: var(--red-bg); border-radius: 16px; }

  /* Sliders — Apple style: thin track, clean thumb */
  .slider-wrap { padding: 4px 2px 0; }
  .slider-track-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--gray-light);
    margin-bottom: 12px;
    font-weight: 500;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--blue) 0%, var(--blue) var(--fill,0%), var(--border) var(--fill,0%), var(--border) 100%);
    outline: none;
    margin: 10px 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.02);
    cursor: grab;
  }
  input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.08); }
  input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    cursor: grab;
  }
  .slider-value-badge {
    display: inline-block;
    background: var(--blue);
    color: white;
    font-weight: 600;
    font-size: 12.5px;
    padding: 5px 13px;
    border-radius: 980px;
    margin-top: 8px;
  }
  .slider-value-badge.untouched { background: #e8e8ed; color: var(--gray); }
  .q.has-error input[type=range] {
    background: linear-gradient(to right, var(--red) 0%, var(--red) var(--fill,0%), #ffd9d6 var(--fill,0%), #ffd9d6 100%);
  }
  .q.has-error .slider-value-badge.untouched { background: var(--red-bg); color: var(--red); }

  .progress-bar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 14px 20px; border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .progress-track { height: 4px; background: #e8e8ed; border-radius: 2px; overflow: hidden; max-width: 640px; margin: 0 auto; }
  .progress-fill { height: 100%; background: var(--blue); transition: width 0.3s; border-radius: 2px; }
  .progress-label { max-width: 640px; margin: 0 auto 8px; font-size: 12px; color: var(--gray-light); font-weight: 500; }

  .btn {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 980px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
    transition: transform 0.1s, opacity 0.15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-primary:disabled { background: #d2d2d7; cursor: not-allowed; }
  .btn-secondary { background: #e8e8ed; color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--gray); font-size: 13px; font-weight: 500; text-decoration: underline; padding: 6px; }
  .nav-row { display: flex; gap: 10px; margin-top: 18px; }

  .crisis-box {
    background: #fff1f0; border: 1.5px solid var(--red); border-radius: 16px;
    padding: 20px; margin-bottom: 20px;
  }
  .crisis-box h3 { color: var(--red); margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .crisis-box p { font-size: 14px; margin: 7px 0; }
  .hidden { display: none !important; }

  .footer-link { text-align: center; margin-top: 30px; }
  .footer-link a { color: var(--gray-light); font-size: 12px; }

  .spinner {
    border: 3px solid #e8e8ed; border-top: 3px solid var(--blue);
    border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .personal-line { font-size: 14.5px; color: var(--gray); margin-top: 10px; }
  .required-note { font-size: 12.5px; color: var(--gray-light); text-align: center; margin: 14px 0 0; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// CONFIG — Apps Script Web App URL (Google Sheet backend)
// ============================================================
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzQ93xINY2MCVJ2UyQU2Mlw3Oq7mGK0wXyV-7egKTZEqkPsccwbOpfEXN-h5qq0zDg/exec";

// ---------------- SURVEY DEFINITION ----------------
const FREQ5 = ["Never","Almost Never","Sometimes","Fairly Often","Very Often"];
const CBI_FREQ = ["Never","Seldom","Sometimes","Often","Always"];
const PHQ_FREQ = ["Not at all","Several days","More than half the days","Nearly every day"];

const sections = [
  {
    key: "identity",
    title: "Your Details",
    sub: "Used to prevent duplicate submissions and follow up if you'd like support.",
    questions: [
      { id: "name", type: "textinput", text: "Name", inputType: "text" },
      { id: "position", type: "textinput", text: "Position", inputType: "text" },
      { id: "email", type: "textinput", text: "Yeeza email", inputType: "email" }
    ]
  },
  {
    key: "background",
    title: "Background",
    sub: "",
    questions: [
      { id: "shift", type: "pills", text: "What is your typical shift pattern?", options: ["Fixed day shift","Rotating shift","Includes on-call duty","Other"] },
      { id: "tenure", type: "pills", text: "How long have you worked at Trust Health Asia?", options: ["Less than 6 months","6 months – 2 years","2–5 years","More than 5 years"] }
    ]
  },
  {
    key: "sleep",
    title: "Sleep",
    sub: "Over the past 2 weeks.",
    questions: [
      { id: "sleep_hours", type: "pills", text: "On average, how many hours of sleep do you get per night?", options: ["<4 hrs","4–5 hrs","5–6 hrs","6–7 hrs","7–8 hrs",">8 hrs"] },
      { id: "sleep_quality", type: "slider", text: "How would you rate your overall sleep quality?", min: 1, max: 5, low: "Very poor", high: "Excellent" },
      { id: "sleep_rested", type: "slider5", text: "Do you feel rested when you wake up?", labels: ["Never","Rarely","Sometimes","Often","Always"] },
      { id: "sleep_disrupt", type: "text", text: "What most disrupts your sleep?" }
    ]
  },
  {
    key: "cbi",
    title: "Burnout",
    sub: "Copenhagen Burnout Inventory — drag the slider to how often each applies to you.",
    questions: [
      { id: "cbi1", type: "slider5", text: "How often are you tired?", labels: CBI_FREQ },
      { id: "cbi2", type: "slider5", text: "How often are you physically exhausted?", labels: CBI_FREQ },
      { id: "cbi3", type: "slider5", text: "How often are you emotionally exhausted?", labels: CBI_FREQ },
      { id: "cbi4", type: "slider5", text: "How often do you think: \"I can't take it anymore\"?", labels: CBI_FREQ },
      { id: "cbi5", type: "slider5", text: "How often do you feel worn out?", labels: CBI_FREQ },
      { id: "cbi6", type: "slider5", text: "How often do you feel weak and susceptible to illness?", labels: CBI_FREQ },
      { id: "cbi7", type: "slider5", text: "Is your work emotionally exhausting?", labels: CBI_FREQ },
      { id: "cbi8", type: "slider5", text: "Does it frustrate you that you cannot cope well enough at work?", labels: CBI_FREQ },
      { id: "cbi9", type: "slider5", text: "Do you feel burnt out because of your work?", labels: CBI_FREQ },
      { id: "cbi10", type: "slider5", text: "Do you find it hard to work with patients/colleagues?", labels: CBI_FREQ },
      { id: "cbi11", type: "slider5", text: "Are you exhausted in the morning at the thought of another day at work?", labels: CBI_FREQ },
      { id: "cbi12", type: "slider5", text: "Do you feel that every working hour is tiring for you?", labels: CBI_FREQ },
      { id: "cbi13", type: "slider5", text: "Do you feel that you have enough energy for family and friends during leisure time?", labels: CBI_FREQ, reverse: true }
    ]
  },
  {
    key: "pss",
    title: "Stress",
    sub: "In the last month, how often have you felt this way? Drag the slider.",
    questions: [
      { id: "pss1", type: "slider5", text: "Felt unable to control the important things in your life", labels: FREQ5 },
      { id: "pss2", type: "slider5", text: "Felt confident about your ability to handle personal problems", labels: FREQ5, reverse: true },
      { id: "pss3", type: "slider5", text: "Felt that things were going your way", labels: FREQ5, reverse: true },
      { id: "pss4", type: "slider5", text: "Felt difficulties were piling up so high you could not overcome them", labels: FREQ5 }
    ]
  },
  {
    key: "gad7",
    title: "Anxiety Screening (GAD-7)",
    sub: "Over the last 2 weeks, how often bothered — drag the slider.",
    questions: [
      { id: "gad1", type: "slider4", text: "Feeling nervous, anxious, or on edge", labels: PHQ_FREQ },
      { id: "gad2", type: "slider4", text: "Not being able to stop or control worrying", labels: PHQ_FREQ },
      { id: "gad3", type: "slider4", text: "Worrying too much about different things", labels: PHQ_FREQ },
      { id: "gad4", type: "slider4", text: "Trouble relaxing", labels: PHQ_FREQ },
      { id: "gad5", type: "slider4", text: "Being so restless that it is hard to sit still", labels: PHQ_FREQ },
      { id: "gad6", type: "slider4", text: "Becoming easily annoyed or irritable", labels: PHQ_FREQ },
      { id: "gad7q", type: "slider4", text: "Feeling afraid as if something awful might happen", labels: PHQ_FREQ }
    ]
  },
  {
    key: "phq9",
    title: "Depression Screening (PHQ-9)",
    sub: "Over the last 2 weeks, how often bothered — drag the slider.",
    questions: [
      { id: "phq1", type: "slider4", text: "Little interest or pleasure in doing things", labels: PHQ_FREQ },
      { id: "phq2", type: "slider4", text: "Feeling down, depressed, or hopeless", labels: PHQ_FREQ },
      { id: "phq3", type: "slider4", text: "Trouble falling/staying asleep, or sleeping too much", labels: PHQ_FREQ },
      { id: "phq4q", type: "slider4", text: "Feeling tired or having little energy", labels: PHQ_FREQ },
      { id: "phq5", type: "slider4", text: "Poor appetite or overeating", labels: PHQ_FREQ },
      { id: "phq6", type: "slider4", text: "Feeling bad about yourself, or that you've let yourself/family down", labels: PHQ_FREQ },
      { id: "phq7", type: "slider4", text: "Trouble concentrating on things", labels: PHQ_FREQ },
      { id: "phq8", type: "slider4", text: "Moving/speaking slowly, or being fidgety/restless", labels: PHQ_FREQ },
      { id: "phq9_selfharm", type: "slider4", text: "Thoughts that you would be better off dead or of hurting yourself", labels: PHQ_FREQ, isSelfHarm: true }
    ]
  },
  {
    key: "feedback",
    title: "Open Feedback",
    sub: "",
    questions: [
      { id: "fb1", type: "text", text: "Anything about your workload, hours, or wellbeing you'd like leadership to know?" },
      { id: "fb2", type: "text", text: "What would help you most right now?" }
    ]
  }
];

// ---------------- STATE ----------------
const STORAGE_KEY = "yewb_survey_progress_v2";

function loadSavedProgress() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveProgress() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ step: state.step, answers: state.answers, touched: state.touched }));
  } catch (e) {}
}
function clearProgress() {
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

const saved = loadSavedProgress();
let state = saved
  ? { step: saved.step, answers: saved.answers, touched: saved.touched || {} }
  : { step: 0, answers: {}, touched: {} };
let view = saved ? "survey" : "intro";
let currentErrors = new Set();
window._showResumeBanner = !!saved;

window.addEventListener("beforeunload", function (e) {
  if (view === "survey" || view === "checking" || view === "submitting") {
    e.preventDefault();
    e.returnValue = "";
    return "";
  }
});

// ---------------- SCORING ----------------
function scoreSurvey(a) {
  const cbiVal = (id) => {
    let v = a[id];
    if (v === undefined) return null;
    if (id === "cbi13") v = 4 - v;
    return v * 25;
  };
  const personalCbi = ["cbi1","cbi2","cbi3","cbi4","cbi5","cbi6"].map(cbiVal).filter(v=>v!==null);
  const workCbi = ["cbi7","cbi8","cbi9","cbi10","cbi11","cbi12","cbi13"].map(cbiVal).filter(v=>v!==null);
  const avg = arr => arr.length ? Math.round(arr.reduce((s,x)=>s+x,0)/arr.length) : null;

  const pssVal = (id, rev) => {
    let v = a[id];
    if (v === undefined) return 0;
    return rev ? 4 - v : v;
  };
  const pssTotal = ["pss1","pss2","pss3","pss4"].reduce((s,id)=>{
    const rev = id==="pss2"||id==="pss3";
    return s + pssVal(id, rev);
  }, 0);

  const gadItems = ["gad1","gad2","gad3","gad4","gad5","gad6","gad7q"];
  const gadTotal = gadItems.reduce((s,id)=> s + (a[id]||0), 0);

  const phqItems = ["phq1","phq2","phq3","phq4q","phq5","phq6","phq7","phq8","phq9_selfharm"];
  const phqTotal = phqItems.reduce((s,id)=> s + (a[id]||0), 0);

  return {
    cbiPersonal: avg(personalCbi),
    cbiWork: avg(workCbi),
    pssTotal,
    gadTotal,
    phqTotal,
    selfHarmFlag: (a["phq9_selfharm"] || 0) > 0
  };
}

// ---------------- API CALLS ----------------
async function checkEmailExists(email) {
  try {
    const res = await fetch(SHEET_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkEmail", email: email })
    });
    const data = await res.json();
    return !!data.exists;
  } catch (e) {
    console.error("Email check failed", e);
    return null;
  }
}
async function submitToSheet(row) {
  try {
    await fetch(SHEET_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "submit", row: row })
    });
    return true;
  } catch (e) {
    console.error("Submit failed", e);
    return false;
  }
}

// ---------------- RENDER ----------------
const app = document.getElementById("app");

function render() {
  if (view === "intro") return renderIntro();
  if (view === "checking") return renderChecking();
  if (view === "blocked") return renderBlocked();
  if (view === "survey") return renderSurvey();
  if (view === "submitting") return renderSubmitting();
  if (view === "selfharm") return renderSelfHarm();
  if (view === "done") return renderDone();
  if (view === "error") return renderError();
}

function renderIntro() {
  app.innerHTML = `
    <header>
      <h1>Year End Well Being Survey</h1>
      <p>Trust Health Asia</p>
    </header>
    <div class="wrap">
      <div class="notice">
        Hi there — this survey is for <strong>you</strong>. It only takes about 6–8 minutes, and every answer helps us understand how you're really doing this year — your sleep, your stress, and your overall wellbeing — so we can support you and the team better.
        <br><br>
        We collect your name and email so that, if anything you share suggests you might need support, someone can reach out to you personally and confidentially. Your individual responses will only be reviewed by designated leadership and will never affect your employment.
      </div>
      <div class="card">
        <p style="font-size:14.5px; margin: 0 0 4px;">Every question in this survey is required — please answer honestly and completely so we get the full picture.</p>
        <p class="personal-line">Takes about 6–8 minutes. One submission per person.</p>
        <button class="btn btn-primary" onclick="startSurvey()">Start Survey</button>
      </div>
    </div>
  `;
}

function startSurvey() {
  clearProgress();
  view = "survey"; state.step = 0; state.answers = {}; state.touched = {};
  currentErrors = new Set();
  render();
}

function renderChecking() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:100px; text-align:center;">
      <div class="spinner"></div>
      <p style="color:var(--gray-light); margin-top:18px; font-size:14px;">Checking your email…</p>
    </div>
  `;
}

function renderBlocked() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px;">
      <div class="card" style="text-align:center;">
        <h2 style="color:var(--red); font-size:20px;">Already Submitted</h2>
        <p style="font-size:14.5px;color:var(--gray);">A response has already been recorded for this email address. This survey allows only one submission per person.</p>
        <p style="font-size:13px;color:var(--gray-light);">If you believe this is an error, please contact your administrator.</p>
        <button class="btn btn-secondary" onclick="view='intro'; render();" style="margin-top:16px;">Back</button>
      </div>
    </div>
  `;
}

function renderError() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px;">
      <div class="warn-box">
        We couldn't reach the server to verify or save your response right now. Please check your internet connection and try again in a moment.
      </div>
      <button class="btn btn-primary" onclick="view='survey'; render();">Back to Survey</button>
    </div>
  `;
}

function renderSurvey() {
  const sec = sections[state.step];
  const totalSteps = sections.length;
  const pct = Math.round(((state.step) / totalSteps) * 100);

  let qHtml = "";
  sec.questions.forEach(q => { qHtml += renderQuestion(q); });

  const resumeBanner = window._showResumeBanner
    ? `<div class="notice" style="margin-bottom:14px;">Welcome back — your progress has been saved and picked up right where you left off.</div>`
    : "";

  app.innerHTML = `
    <div class="progress-bar">
      <div class="progress-label">Step ${state.step + 1} of ${totalSteps}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wrap">
      ${resumeBanner}
      <div class="card">
        <div class="section-title">${sec.title}</div>
        ${sec.sub ? `<div class="section-sub">${sec.sub}</div>` : ""}
        ${qHtml}
      </div>
      <div class="nav-row">
        ${state.step > 0 ? `<button class="btn btn-secondary" onclick="prevStep()">Back</button>` : ""}
        <button class="btn btn-primary" onclick="nextStep()">${state.step === totalSteps-1 ? "Submit" : "Next"}</button>
      </div>
      <p class="required-note">All questions are required.</p>
    </div>
  `;
  window._showResumeBanner = false;

  if (currentErrors.size > 0) {
    const firstErrorEl = document.querySelector(".q.has-error");
    if (firstErrorEl) firstErrorEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function isAnswered(q) {
  const v = state.answers[q.id];
  if (q.type === "textinput") return !!(v && v.trim());
  if (q.type === "text") return !!(v && v.trim());
  if (q.type === "pills") return v !== undefined && v !== null && v !== "";
  if (q.type === "slider" || q.type === "slider5" || q.type === "slider4") return !!state.touched[q.id];
  return true;
}

function renderQuestion(q) {
  const val = state.answers[q.id];
  const hasError = currentErrors.has(q.id);
  const errMsg = hasError ? `<div class="q-error-msg">⚠ Please answer this question to continue</div>` : "";

  if (q.type === "textinput") {
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <input type="${q.inputType}" value="${val || ""}" oninput="setAnswer('${q.id}', this.value)" placeholder="${q.text}">
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "pills") {
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <div class="pill-row">
          ${q.options.map(opt => `
            <div class="pill ${val === opt ? 'selected' : ''}" onclick="setAnswer('${q.id}', '${opt.replace(/'/g,"\\'")}')">${opt}</div>
          `).join("")}
        </div>
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "slider") {
    const touched = !!state.touched[q.id];
    const displayVal = touched ? val : q.min;
    const fillPct = ((displayVal - q.min) / (q.max - q.min)) * 100;
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <div class="slider-wrap">
          <input type="range" min="${q.min}" max="${q.max}" step="1" value="${displayVal}"
            style="--fill:${fillPct}%"
            oninput="handleSliderInput('${q.id}', this)">
          <div class="slider-track-labels"><span>${q.low}</span><span>${q.high}</span></div>
          <span class="slider-value-badge ${touched?'':'untouched'}" id="badge-${q.id}">${touched ? displayVal : 'Slide to answer'}</span>
        </div>
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "slider5" || q.type === "slider4") {
    const max = q.type === "slider5" ? 4 : 3;
    const touched = !!state.touched[q.id];
    const displayVal = touched ? val : 0;
    const fillPct = (displayVal / max) * 100;
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <div class="slider-wrap">
          <input type="range" min="0" max="${max}" step="1" value="${displayVal}"
            style="--fill:${fillPct}%"
            oninput="handleSliderInput('${q.id}', this, ${JSON.stringify(q.labels)})">
          <div class="slider-track-labels"><span>${q.labels[0]}</span><span>${q.labels[q.labels.length-1]}</span></div>
          <span class="slider-value-badge ${touched?'':'untouched'}" id="badge-${q.id}">${touched ? q.labels[displayVal] : 'Slide to answer'}</span>
        </div>
        ${errMsg}
      </div>
    `;
  }

  if (q.type === "text") {
    return `
      <div class="q ${hasError ? 'has-error' : ''}">
        <div class="q-text">${q.text}<span class="req-star">*</span></div>
        <textarea oninput="setAnswer('${q.id}', this.value)">${val || ""}</textarea>
        ${errMsg}
      </div>
    `;
  }
  return "";
}

function handleSliderInput(id, el, labels) {
  const v = Number(el.value);
  const min = Number(el.min), max = Number(el.max);
  const fillPct = ((v - min) / (max - min)) * 100;
  el.style.setProperty('--fill', fillPct + '%');
  const badge = document.getElementById('badge-' + id);
  if (badge) {
    badge.textContent = labels ? labels[v] : v;
    badge.classList.remove('untouched');
  }
  state.answers[id] = v;
  state.touched[id] = true;
  if (currentErrors.has(id)) {
    currentErrors.delete(id);
    const qEl = badge ? badge.closest('.q') : null;
    if (qEl) {
      qEl.classList.remove('has-error');
      const msg = qEl.querySelector('.q-error-msg');
      if (msg) msg.remove();
    }
  }
  saveProgress();
}

function setAnswer(id, value) {
  state.answers[id] = value;
  saveProgress();
  if (currentErrors.has(id) && value && String(value).trim()) {
    currentErrors.delete(id);
  }
  if (event && event.type === "click") {
    render();
  } else if (currentErrors.has(id) === false && document.querySelector(`[data-q-id="${id}"]`)) {
    // no-op, error already cleared visually on next render
  }
}

function prevStep() {
  if (state.step > 0) { state.step--; currentErrors = new Set(); saveProgress(); render(); }
}

function validateStep() {
  const sec = sections[state.step];
  const missing = [];
  sec.questions.forEach(q => {
    if (!isAnswered(q)) missing.push(q.id);
  });
  currentErrors = new Set(missing);
  return missing.length === 0;
}

async function nextStep() {
  if (!validateStep()) {
    render();
    return;
  }

  const isLast = state.step === sections.length - 1;

  if (sections[state.step].key === "identity") {
    const email = state.answers.email.trim();
    if (!email.includes("@")) {
      currentErrors = new Set(["email"]);
      render();
      return;
    }
    view = "checking"; render();
    const exists = await checkEmailExists(email.toLowerCase());
    if (exists === true) {
      clearProgress();
      view = "blocked"; render();
      return;
    }
    state.step++;
    view = "survey";
    saveProgress();
    render();
    return;
  }

  if (!isLast) {
    state.step++;
    saveProgress();
    render();
    return;
  }

  // Final submission
  view = "submitting"; render();
  const scores = scoreSurvey(state.answers);
  const a = state.answers;
  const row = [
    new Date().toISOString(),
    a.name || "",
    a.email || "",
    a.position || "",
    a.shift || "",
    a.tenure || "",
    a.sleep_hours || "",
    a.sleep_quality ?? "",
    scores.gadTotal,
    scores.phqTotal,
    scores.cbiPersonal ?? "",
    scores.cbiWork ?? "",
    scores.pssTotal,
    scores.selfHarmFlag,
    (a.fb1 || "").replace(/\n/g," "),
    (a.fb2 || "").replace(/\n/g," ")
  ];
  const ok = await submitToSheet(row);
  if (!ok) {
    view = "error"; render();
    return;
  }
  clearProgress();
  window._lastScores = scores;
  view = scores.selfHarmFlag ? "selfharm" : "done";
  render();
}

function renderSubmitting() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:100px; text-align:center;">
      <div class="spinner"></div>
      <p style="color:var(--gray-light); margin-top:18px; font-size:14px;">Submitting your response…</p>
    </div>
  `;
}

function renderSelfHarm() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:50px;">
      <div class="crisis-box">
        <h3>Please reach out for support</h3>
        <p>Thank you for your honesty. One of your answers suggests you may be going through something very difficult right now. You don't have to face this alone.</p>
        <p><strong>Trust's Health Concierge:</strong> +6011-6976 9233</p>
        <p><strong>Befrienders KL:</strong> 03-7627 2929 (24 hours)</p>
        <p><strong>Talian Kasih:</strong> 15999 (24 hours)</p>
        <p><strong>MIASA Mental Health Helpline:</strong> 1-800-180-066</p>
        <p>If you are in immediate danger, please go to the nearest hospital emergency department or call 999.</p>
        <p style="margin-top:12px;">Please also consider speaking with a trusted colleague, family member, or one of the contacts above.</p>
      </div>
      <button class="btn btn-primary" onclick="view='done'; render();">Continue</button>
    </div>
  `;
}

function renderDone() {
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px; text-align:center;">
      <div class="card">
        <h2 style="color:var(--blue); font-size:22px;">Thank you</h2>
        <p style="font-size:14.5px;color:var(--gray);">Your response has been submitted and recorded. We appreciate you taking the time to share this with us.</p>
        <p style="font-size:13px;color:var(--gray-light);margin-top:16px;">If you are experiencing significant distress, please don't wait — reach out to Trust's Health Concierge (+6011-6976 9233), Befrienders KL (03-7627 2929), or Talian Kasih (15999).</p>
      </div>
    </div>
  `;
}

render();
</script>
